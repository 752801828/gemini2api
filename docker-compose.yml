services:
  gemini2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gemini2api:local
    container_name: gemini2api
    # 镜像以 root 启动后由 docker-entrypoint.sh 修复 ./data、./api 卷属主再降权到非 root
    # 的 appuser 运行；无需在此指定 user:，更新代码后用 `docker compose up -d --build` 部署。
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - BROWSER_REFRESHER_URL=http://refresher:6080
    ports:
      - "5918:5918"
    volumes:
      - ./data:/app/data
      - ./api:/app/api
      - ./accounts.json:/app/accounts.json
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo/Asia/Shanghai:/usr/share/zoneinfo/Asia/Shanghai:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5918/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - refresher
    networks:
      - default
      - gemini-bridge

  # 内置 Cookie 浏览器：每个账号使用 data/browser_profiles/<account-id> 独立 Profile；
  # 主服务检测到登录失效或管理员手动触发时，按需启动 Chromium 获取并热更新 Cookie。
  refresher:
    build:
      context: ./refresher
      dockerfile: Dockerfile
    image: gemini2api-refresher:latest
    container_name: gemini2api-refresher
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - REFRESHER_MODE=server
      - REFRESHER_PORT=6080
    command: ["/app/start.sh"]
    expose:
      - "6080"
    ports:
      # 仅本机可访问的人工登录浏览器（noVNC），不会暴露到局域网。
      - "127.0.0.1:6081:6081"
    volumes:
      # 与主服务共享 ./data，浏览器 Profile 持久化且按账号隔离。
      - ./data:/app/data
    restart: unless-stopped

networks:
  gemini-bridge:
    external: true
