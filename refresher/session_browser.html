<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini2API · 账号浏览器</title>
  <style>
    :root { color-scheme: dark; font-family: Bahnschrift, "Segoe UI Variable", sans-serif; --ink:#090d0c; --panel:#17201e; --line:#32413d; --lime:#b9f227; --muted:#9aaba6; --danger:#ff6d67; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--ink); color:#f4f8f6; }
    body { display:grid; grid-template-rows:48px minmax(0,1fr); }
    #statusBar { display:flex; align-items:center; gap:11px; min-width:0; padding:0 10px 0 15px; background:linear-gradient(90deg,#17201e,#111816); border-bottom:1px solid var(--line); box-shadow:0 8px 26px rgb(0 0 0 / 28%); z-index:3; }
    #stateDot { width:8px; height:8px; flex:none; border-radius:50%; background:#e6af3f; box-shadow:0 0 0 5px rgb(230 175 63 / 10%); }
    #stateDot.ready { background:var(--lime); box-shadow:0 0 0 5px rgb(185 242 39 / 10%); }
    #stateDot.error { background:var(--danger); box-shadow:0 0 0 5px rgb(255 109 103 / 10%); }
    #statusText { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
    #identity { min-width:0; color:var(--muted); font:11px/1.2 Consolas, monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #toolbar { display:flex; gap:4px; margin-left:auto; flex:none; }
    .tool { display:grid; place-items:center; width:32px; height:32px; padding:0; border:1px solid transparent; border-radius:5px; background:transparent; color:#edf5f1; font-size:18px; cursor:pointer; transition:.16s ease; }
    .tool:hover { border-color:#4b605a; background:#26322f; transform:translateY(-1px); }
    .tool.primary { color:var(--ink); background:var(--lime); border-color:var(--lime); font-weight:900; }
    .tool.active { color:var(--ink); background:#f2c95f; border-color:#f2c95f; }
    .tool:disabled { opacity:.42; cursor:wait; transform:none; }
    #screen { position:relative; min-width:0; min-height:0; overflow:hidden; background:radial-gradient(circle at 50% 40%,#14201d,#060807 62%); }
    #screen canvas { outline:none; }
    #message { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:#c4cfcb; font-size:13px; letter-spacing:.03em; pointer-events:none; }
    #pasteOverlay { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:20px; background:rgb(0 0 0 / 66%); backdrop-filter:blur(6px); }
    #pasteOverlay[hidden] { display:none; }
    #pasteDialog { width:min(460px,100%); padding:17px; border:1px solid #4a5d57; border-radius:8px; background:#17201e; box-shadow:0 24px 65px rgb(0 0 0 / 52%); }
    #pasteTitle { margin:0 0 11px; color:var(--lime); font-size:13px; letter-spacing:.07em; text-transform:uppercase; }
    #pasteText { display:block; width:100%; min-height:120px; resize:vertical; padding:10px; border:1px solid #465954; border-radius:5px; background:#090d0c; color:#f4f8f6; font:13px/1.55 Consolas, monospace; }
    #pasteText:focus { outline:2px solid var(--lime); outline-offset:1px; }
    #pasteActions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
    .action { min-width:68px; height:32px; padding:0 12px; border:1px solid #4a5d57; border-radius:5px; background:#25312e; color:#edf5f1; cursor:pointer; }
    .action.primary { border-color:var(--lime); background:var(--lime); color:var(--ink); font-weight:800; }
    @media (max-width:720px) { #identity { display:none; } #statusBar { gap:7px; padding-left:10px; } .tool { width:30px; } }
  </style>
</head>
<body>
  <header id="statusBar">
    <span id="stateDot"></span>
    <span id="statusText">正在连接账号浏览器</span>
    <span id="identity"></span>
    <div id="toolbar">
      <button class="tool primary" id="complete" type="button" title="登录完成并同步 CK" aria-label="登录完成并同步 CK">✓</button>
      <button class="tool" id="capsLock" type="button" title="切换大写锁定" aria-pressed="false">⇪</button>
      <button class="tool" id="paste" type="button" title="粘贴到远程浏览器">⎘</button>
      <button class="tool" id="copyRemote" type="button" title="远程浏览器尚未复制文本" aria-label="复制远程文本到本机" disabled>⧉</button>
      <button class="tool" id="reconnect" type="button" title="重新连接">↻</button>
      <button class="tool" id="scale" type="button" title="切换缩放">⌖</button>
      <button class="tool" id="fullscreen" type="button" title="全屏">⛶</button>
      <button class="tool" id="close" type="button" title="关闭浏览器">×</button>
    </div>
  </header>
  <main id="screen"><div id="message">正在加载 noVNC</div></main>
  <div id="pasteOverlay" hidden>
    <div id="pasteDialog" role="dialog" aria-modal="true" aria-labelledby="pasteTitle">
      <h2 id="pasteTitle">粘贴到远程浏览器</h2>
      <textarea id="pasteText" autocomplete="off" spellcheck="false"></textarea>
      <div id="pasteActions"><button class="action" id="cancelPaste" type="button">取消</button><button class="action primary" id="sendPaste" type="button">粘贴</button></div>
    </div>
  </div>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const accountId = /^[A-Za-z0-9_-]{1,64}$/.test(params.get('account_id') || '') ? params.get('account_id') : '';
    const parentOrigin = params.get('parent_origin') || '';
    const screen = document.getElementById('screen');
    const message = document.getElementById('message');
    const statusText = document.getElementById('statusText');
    const identity = document.getElementById('identity');
    const stateDot = document.getElementById('stateDot');
    const completeButton = document.getElementById('complete');
    const copyRemoteButton = document.getElementById('copyRemote');
    const capsLockButton = document.getElementById('capsLock');
    const pasteOverlay = document.getElementById('pasteOverlay');
    const pasteText = document.getElementById('pasteText');
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const websocketUrl = `${protocol}//${location.host}/websockify`;
    let rfb = null;
    let scaleViewport = true;
    let capsLocked = false;
    let closing = false;
    let connectionTimer = null;
    let pasteTimer = null;
    let latestRemoteClipboardText = '';
    identity.textContent = accountId ? `PROFILE / ${accountId}` : 'PROFILE / UNKNOWN';

    function setStatus(text, state = '') { statusText.textContent = text; stateDot.className = state; }
    function showConnectionError(text) { if (connectionTimer) clearTimeout(connectionTimer); message.hidden = false; message.textContent = text; setStatus(text, 'error'); }
    let RFB;
    try { ({ default: RFB } = await import('./core/rfb.js')); }
    catch (error) { showConnectionError('noVNC 资源加载失败，请关闭后重试'); throw error; }

    function clearRemoteClipboard() { latestRemoteClipboardText = ''; copyRemoteButton.disabled = true; copyRemoteButton.classList.remove('active'); }
    function connectRfb() {
      if (rfb) rfb.disconnect();
      clearRemoteClipboard();
      message.hidden = false; message.textContent = '正在连接浏览器画面'; setStatus('正在连接账号浏览器');
      if (connectionTimer) clearTimeout(connectionTimer);
      connectionTimer = setTimeout(() => showConnectionError('连接超时，请点击右上角重连'), 15000);
      rfb = new RFB(screen, websocketUrl, { credentials: { password: '' } });
      rfb.scaleViewport = scaleViewport; rfb.resizeSession = true;
      rfb.addEventListener('clipboard', handleRemoteClipboard);
      rfb.addEventListener('connect', () => { clearTimeout(connectionTimer); message.hidden = true; setStatus('浏览器已连接，登录 Gemini 后点击 ✓', 'ready'); });
      rfb.addEventListener('disconnect', event => { if (!event.detail.clean && !closing) showConnectionError('画面已断开，请点击右上角重连'); });
    }

    function sendParent(action) {
      if (!window.opener || !parentOrigin) { setStatus('请回到浏览器中心执行同步或关闭', 'error'); return; }
      window.opener.postMessage({ source:'gemini2api-browser', action, accountId }, parentOrigin);
    }
    completeButton.addEventListener('click', () => { completeButton.disabled = true; setStatus('正在验证登录状态并同步 CK'); sendParent('capture'); });
    document.getElementById('close').addEventListener('click', () => { closing = true; setStatus('正在关闭账号浏览器'); sendParent('close'); });
    window.addEventListener('message', event => {
      if (event.origin !== parentOrigin || event.source !== window.opener || event.data?.source !== 'gemini2api-admin') return;
      if (!event.data.success) { completeButton.disabled = false; setStatus(event.data.error || '操作失败，请重试', 'error'); return; }
      if (event.data.action === 'capture') { setStatus('登录状态已保存，CK 同步完成', 'ready'); setTimeout(() => window.close(), 900); }
      if (event.data.action === 'close') window.close();
    });

    function toggleCapsLock() { if (!rfb) return; capsLocked = !capsLocked; rfb.sendKey(0xffe5,'CapsLock',true); rfb.sendKey(0xffe5,'CapsLock',false); capsLockButton.classList.toggle('active',capsLocked); capsLockButton.setAttribute('aria-pressed',String(capsLocked)); }
    capsLockButton.addEventListener('click', toggleCapsLock);
    async function writeLocalClipboard(text, legacy = false) { if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text); if (!legacy) throw new Error('permission'); const area=document.createElement('textarea'); area.value=text; area.style.cssText='position:fixed;opacity:0'; document.body.appendChild(area); area.select(); const ok=document.execCommand('copy'); area.remove(); if(!ok) throw new Error('copy failed'); }
    async function handleRemoteClipboard(event) { const text=String(event.detail?.text||''); if(!text) return; latestRemoteClipboardText=text; copyRemoteButton.disabled=false; copyRemoteButton.classList.add('active'); try { await writeLocalClipboard(text); copyRemoteButton.classList.remove('active'); setStatus('远程文本已复制到本机','ready'); } catch (_) { setStatus('已收到远程文本，点击 ⧉ 复制'); } }
    copyRemoteButton.addEventListener('click', async () => { if(!latestRemoteClipboardText) return; try { await writeLocalClipboard(latestRemoteClipboardText,true); copyRemoteButton.classList.remove('active'); setStatus('远程文本已复制到本机','ready'); } catch (_) { setStatus('本机浏览器未允许写入剪贴板','error'); } });
    function pasteIntoRemote(text) { if(!rfb||!text) return; rfb.clipboardPasteFrom(text); clearTimeout(pasteTimer); pasteTimer=setTimeout(()=>{ rfb.sendKey(0xffe3,'ControlLeft',true); rfb.sendKey(0x0076,'KeyV',true); rfb.sendKey(0x0076,'KeyV',false); rfb.sendKey(0xffe3,'ControlLeft',false); },800); }
    document.getElementById('paste').addEventListener('click', async () => { try { const text=await navigator.clipboard.readText(); if(text){pasteIntoRemote(text);return;} } catch (_) {} pasteOverlay.hidden=false; pasteText.value=''; pasteText.focus(); });
    document.getElementById('cancelPaste').addEventListener('click',()=>{pasteOverlay.hidden=true;});
    document.getElementById('sendPaste').addEventListener('click',()=>{const text=pasteText.value;pasteOverlay.hidden=true;pasteIntoRemote(text);});
    pasteOverlay.addEventListener('click',event=>{if(event.target===pasteOverlay)pasteOverlay.hidden=true;});
    document.getElementById('reconnect').addEventListener('click',connectRfb);
    document.getElementById('scale').addEventListener('click',()=>{scaleViewport=!scaleViewport;if(rfb)rfb.scaleViewport=scaleViewport;});
    document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();});
    connectRfb();
  </script>
</body>
</html>
