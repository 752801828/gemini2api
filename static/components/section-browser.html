<link rel="stylesheet" href="components/section-browser.css?v=2">
<section id="browser" class="section browser-center" aria-labelledby="browser-title">
    <header class="browser-hero">
        <div>
            <span class="browser-eyebrow">BUILT-IN CHROMIUM</span>
            <h2 id="browser-title">浏览器中心</h2>
            <p>每个账号一套独立 Profile。打开 Flow 风格会话页，手动登录 Gemini 后可在顶部一键回写 CK。</p>
        </div>
        <div class="browser-service-state"><i class="fas fa-circle"></i><span>项目内部服务</span><b>无需插件</b></div>
    </header>

    <div class="browser-flow" aria-label="浏览器续期流程">
        <span><b>01</b> 点击打开浏览器</span><i class="fas fa-arrow-right"></i>
        <span><b>02</b> 手动登录 Gemini</span><i class="fas fa-arrow-right"></i>
        <span><b>03</b> 会话页点击 ✓ 同步 CK</span><i class="fas fa-arrow-right"></i>
        <span><b>04</b> 验证失败飞书告警</span>
    </div>

    <div class="browser-center-toolbar">
        <div><b>账号 Profile</b><small>同一时间只打开一个人工浏览器。会话页提供剪贴板、重连、缩放和全屏；登录完成请点击顶部 ✓。</small></div>
        <span class="browser-toolbar-actions">
            <em id="flowBridgeState" class="browser-flow-state">Flow 未读取</em>
            <button id="syncFlowBridgeBtn" class="btn btn-sm btn-primary" type="button"><i class="fas fa-arrows-rotate"></i> 从 Flow 同步账号/CK</button>
            <a class="btn btn-sm btn-outline" href="#patrol"><i class="fas fa-bell"></i> 飞书告警设置</a>
        </span>
    </div>
    <div id="browserProfilesList" class="browser-profiles-grid"><div class="browser-profile-empty">正在加载浏览器 Profile…</div></div>
</section>
