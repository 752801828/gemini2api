<link rel="stylesheet" href="components/section-patrol.css?v=5">
<section id="patrol" class="section patrol-section" aria-labelledby="patrol-title">
    <div class="section-header patrol-heading">
        <div>
            <p class="patrol-kicker">SERVICE SENTINEL</p>
            <h2 id="patrol-title">盘巡中心</h2>
            <p class="patrol-subtitle">随机问题、随机模型、随机图片组合，持续验证每个账号的真实可用性。</p>
        </div>
        <button class="btn btn-primary" id="patrol-run-btn"><i class="fas fa-play"></i> 立即执行一轮</button>
    </div>

    <div class="patrol-livebar" id="patrol-livebar">
        <span class="patrol-live-dot"></span>
        <strong id="patrol-state">等待数据</strong>
        <span id="patrol-next-run">—</span>
    </div>

    <div class="patrol-stats">
        <article class="patrol-stat">
            <span>今日任务</span>
            <strong id="patrol-today-tasks">0</strong>
            <small id="patrol-today-detail">0 轮 · 0 成功</small>
        </article>
        <article class="patrol-stat patrol-stat-accent">
            <span>本轮任务</span>
            <strong id="patrol-current-tasks">0</strong>
            <small id="patrol-current-detail">0 成功 · 0 失败</small>
        </article>
        <article class="patrol-stat">
            <span>历史任务</span>
            <strong id="patrol-history-tasks">0</strong>
            <small id="patrol-history-detail">0 轮 · 0 成功</small>
        </article>
    </div>

    <div class="patrol-panel patrol-library">
        <div class="patrol-panel-title">
            <div><span>图文测试素材库</span><small>先上传你的图片；执行时只会从这里随机抽取，不会生成新图片</small></div>
            <div class="patrol-upload-actions">
                <span id="patrol-image-total" class="patrol-library-count">0 张</span>
                <button class="btn btn-sm btn-outline" type="button" id="patrol-upload-btn"><i class="fas fa-cloud-arrow-up"></i> 上传图片</button>
                <input id="patrol-image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
            </div>
        </div>
        <div id="patrol-image-library" class="patrol-image-library"><div class="patrol-library-empty">还没有图片，上传后才能执行图文测试</div></div>
    </div>

    <div class="patrol-layout">
        <form class="patrol-panel patrol-config" id="patrol-config-form">
            <div class="patrol-panel-title">
                <div><span>自动化策略</span><small>保存后重新计算下一轮时间</small></div>
                <label class="patrol-switch"><input type="checkbox" id="patrol-enabled"><span></span></label>
            </div>

            <div class="patrol-config-body">
                <div class="patrol-config-column">
                    <label class="form-label" for="patrol-interval">每轮间隔（分钟）</label>
                    <input class="form-control" id="patrol-interval" type="number" min="1" max="10080" value="60" required>
                    <span class="form-label patrol-label">每账号每轮测试次数</span>
                    <div class="patrol-test-counters">
                        <label><span><b>文字</b><small>独立任务数</small></span><input class="form-control" id="patrol-text-count" type="number" min="1" max="20" value="1"></label>
                        <label><span><b>图文</b><small>独立任务数</small></span><input class="form-control" id="patrol-image-count" type="number" min="1" max="20" value="1"></label>
                    </div>
                    <label class="patrol-check"><input type="checkbox" id="patrol-text-enabled" checked><span><b>文字测试</b><small>6 套模板随机提问</small></span></label>
                    <label class="patrol-check"><input type="checkbox" id="patrol-image-enabled" checked><span><b>图文测试</b><small>上传图片搭配 5 套描述问题</small></span></label>
                </div>

                <div class="patrol-config-column">
                    <span class="form-label patrol-label">每次图文任务随机图片张数</span>
                    <div class="patrol-count-range">
                        <label><small>最少</small><input class="form-control" id="patrol-image-min" type="number" min="1" max="5" value="1"></label>
                        <span>至</span>
                        <label><small>最多</small><input class="form-control" id="patrol-image-max" type="number" min="1" max="5" value="5"></label>
                    </div>
                    <span class="form-label patrol-label">测试模型（多选后每个任务随机）</span>
                    <div class="patrol-model-grid" id="patrol-models">
                        <label><input type="checkbox" value="gemini-flash" checked><span>Flash</span></label>
                        <label><input type="checkbox" value="gemini-flash-lite"><span>Flash Lite</span></label>
                        <label><input type="checkbox" value="gemini-pro"><span>Pro</span></label>
                        <label><input type="checkbox" value="gemini-flash-thinking"><span>Thinking</span></label>
                    </div>
                </div>

                <div class="patrol-config-column">
                    <div class="patrol-notify-row">
                        <div><b>飞书通知</b><small id="patrol-webhook-state">尚未配置 Webhook</small></div>
                        <label class="patrol-switch"><input type="checkbox" id="patrol-notify-enabled" checked><span></span></label>
                    </div>
                    <input class="form-control" id="patrol-webhook" type="url" placeholder="留空则保留当前 Webhook">
                    <input class="form-control" id="patrol-secret" type="password" autocomplete="new-password" placeholder="留空则保留当前校验密钥">
                </div>
            </div>

            <button class="btn btn-primary patrol-save" type="submit"><i class="fas fa-check"></i> 保存盘巡设置</button>
        </form>

        <div class="patrol-panel patrol-history-panel">
            <div class="patrol-panel-title">
                <div><span>轮次记录</span><small>先展开轮次，再点击具体任务查看完整问题、图片、响应和耗时</small></div>
                <button class="btn btn-sm btn-outline" type="button" id="patrol-refresh-btn"><i class="fas fa-rotate"></i></button>
            </div>
            <div id="patrol-history" class="patrol-history"><div class="patrol-empty">暂无盘巡记录</div></div>
        </div>
    </div>
</section>
